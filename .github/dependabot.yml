version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # flarum/core depende de laminas/laminas-stratigility, que aún no admite PHP 8.6. Quitar cuando lo haga.
      - dependency-name: serversideup/php
        versions: [">= 8.6"]
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
